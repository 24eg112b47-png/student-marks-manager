services:
  - type: web
    name: student-marks-manager
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TEACHER_INVITE_CODE
        sync: false
      - key: SESSION_SECRET
        sync: false